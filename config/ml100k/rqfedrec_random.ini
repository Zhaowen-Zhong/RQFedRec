[exp]
name = RQFedRec
output = ml100k_random
random_seed = 42

[dataset]
name = Pair
path = ./datasets/ml100k
sample_method = all
client_num = 100
num_negative = 1

[model]
name = RQFedRec
latent_dim = 128
sid_length = 3

[train]
lr = 0.01
cluster_num = 512
weight_decay = 1e-6
batch_size = 256
epoch = 500
early_stop_num = 10
update_frequence = 1
student_epoch = 1
teacher_epoch = 1
initial_sid = random
sid_update_interval = 5
